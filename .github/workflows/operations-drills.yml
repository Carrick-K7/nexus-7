name: Operations drills

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

jobs:
  disaster-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create recovery target
        env:
          PGPASSWORD: nexus
        run: >-
          psql -h 127.0.0.1 -U nexus -d nexus
          -c "CREATE DATABASE nexus_restore"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus
        run: npm run db:migrate

      - name: Execute recovery drill
        env:
          TEST_DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus
          TEST_RESTORE_DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus_restore
        run: npm run ops:recovery-drill

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v7
        with:
          name: nexus-recovery-drill
          path: .artifacts/recovery-drill.json
          include-hidden-files: true
          retention-days: 90

      - name: Attest recovery evidence
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/recovery-drill.json

  deployment-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment controller contract
        run: npm run verify:deployment-contract

      - name: Upload controller conformance evidence
        uses: actions/upload-artifact@v7
        with:
          name: nexus-deployment-controller-conformance
          path: .artifacts/deployment-controller-conformance.json
          include-hidden-files: true
          retention-days: 90

      - name: Attest controller conformance evidence
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/deployment-controller-conformance.json

      - name: Execute deployment rollback drill
        env:
          NEXUS_DEPLOYMENT_ADAPTER: http
          NEXUS_DEPLOYMENT_BASE_URL: ${{ secrets.NEXUS_DEPLOYMENT_BASE_URL }}
          NEXUS_DEPLOYMENT_TOKEN: ${{ secrets.NEXUS_DEPLOYMENT_TOKEN }}
        run: npm run ops:deployment-drill

      - name: Upload rollback evidence
        uses: actions/upload-artifact@v7
        with:
          name: nexus-deployment-rollback-drill
          path: .artifacts/deployment-rollback-drill.json
          include-hidden-files: true
          retention-days: 90

      - name: Attest rollback evidence
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/deployment-rollback-drill.json

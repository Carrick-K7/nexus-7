name: Promotion receipt

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  configuration:
    name: Receipt configuration
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.receipt-key.outputs.configured }}
    steps:
      - name: Record receipt-signing readiness
        id: receipt-key
        env:
          RECEIPT_KEY: ${{ secrets.NEXUS_ATTESTATION_RECEIPT_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -n "$RECEIPT_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Receipt signing is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Receipt signing is pending human key configuration; no receipt was issued." >> "$GITHUB_STEP_SUMMARY"
          fi

  issue:
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Checkout attested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          gh run download "$RUN_ID"
          --repo "${{ github.repository }}"
          --name nexus-verification-evidence
          --dir .verified

      - name: Verify provenance and issue receipt
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUS_ATTESTATION_REPOSITORY: ${{ github.repository }}
          NEXUS_ATTESTATION_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/ci.yml
          NEXUS_ATTESTATION_RECEIPT_PRIVATE_KEY_BASE64: ${{ secrets.NEXUS_ATTESTATION_RECEIPT_PRIVATE_KEY_BASE64 }}
        run: >-
          npm run evidence:verify --
          .verified/public/data/ci-evidence.json
          .artifacts/attestation-receipt.json

      - name: Upload short-lived promotion receipt
        uses: actions/upload-artifact@v7
        with:
          name: nexus-promotion-receipt-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/attestation-receipt.json
          include-hidden-files: true
          retention-days: 1
